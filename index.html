<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PING 1.5 - Juego del Cubo</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .top-bar {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #ff5722;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e64a19;
        }
        /* Lienzo en relación de aspecto 16:9 y tamaño ampliado */
        canvas {
            width: 85vw;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            border: 3px solid #ffffff;
            background-color: #111;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        #mensaje {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            height: 25px;
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="btnReiniciar">Reiniciar Juego</button>
    </div>

    <!-- Resolución interna ajustada a 1280x720 (16:9) -->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div id="mensaje">Cargando nivel...</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mensaje = document.getElementById('mensaje');
const btnReiniciar = document.getElementById('btnReiniciar');

// Rutas de audio, imágenes y nivel
const URL_AUDIO_PING = 'https://raw.githubusercontent.com/sussybakauser/PING-1.5-In-Website/main/Audio/Cube%20Sounds/ping.ogg';
const URL_AUDIO_BREAK = 'https://raw.githubusercontent.com/sussybakauser/PING-1.5-In-Website/main/Audio/Cube%20Sounds/breakblock.ogg';
const URL_SPRITE_CUBE = 'https://raw.githubusercontent.com/sussybakauser/PING-1.5-In-Website/main/Sprites/Cube.png';
const URL_SPRITE_CIRCLE = 'https://raw.githubusercontent.com/sussybakauser/PING-1.5-In-Website/main/Sprites/Circle.png';
const URL_NIVEL_WORLD1 = 'https://raw.githubusercontent.com/sussybakauser/PING-1.5-In-Website/main/Levels/World1-1.json';

// Nivel por defecto (World1-1)
const NIVEL_DEFAULT = {
  "gridSize": 30,
  "maxShots": 1,
  "maxBounces": 10,
  "cuboColor": "#00ADB5",
  "cubo": { "x": 120, "y": 360 },
  "meta": { "x": 705, "y": 405 },
  "obstaculos": [ 
    { "x": 480, "y": 300, "color": "#FFFF00" }, { "x": 510, "y": 330, "color": "#FFFF00" }, 
    { "x": 540, "y": 360, "color": "#FFFF00" }, { "x": 540, "y": 390, "color": "#FFFF00" }, 
    { "x": 570, "y": 390, "color": "#FFFF00" }, { "x": 540, "y": 420, "color": "#FFFF00" }, 
    { "x": 510, "y": 450, "color": "#FFFF00" }, { "x": 480, "y": 480, "color": "#FFFF00" }, 
    { "x": 480, "y": 390, "color": "#FFFF00" }, { "x": 360, "y": 390, "color": "#FFFF00" }, 
    { "x": 330, "y": 390, "color": "#FFFF00" }, { "x": 300, "y": 390, "color": "#FFFF00" }, 
    { "x": 390, "y": 390, "color": "#FFFF00" }, { "x": 420, "y": 390, "color": "#FFFF00" }, 
    { "x": 450, "y": 390, "color": "#FFFF00" }, { "x": 510, "y": 390, "color": "#FFFF00" } 
  ]
};

// Objetos de Audio
const sonidoRebote = new Audio(URL_AUDIO_PING);
const sonidoBreak = new Audio(URL_AUDIO_BREAK);

// Carga de Sprites
const spriteCubo = new Image();
spriteCubo.src = URL_SPRITE_CUBE;
let spriteCuboCargado = false;
spriteCubo.onload = () => { spriteCuboCargado = true; };

const spriteCirculo = new Image();
spriteCirculo.src = URL_SPRITE_CIRCLE;
let spriteCirculoCargado = false;
spriteCirculo.onload = () => { spriteCirculoCargado = true; };

function reproducirSonidoRebote() {
    sonidoRebote.currentTime = 0;
    sonidoRebote.play().catch(e => console.log("Audio esperando interacción:", e));
}

function reproducirSonidoBreak() {
    sonidoBreak.currentTime = 0;
    sonidoBreak.play().catch(e => console.log("Audio esperando interacción:", e));
}

// Configuración global
let MAX_DISPAROS = 5;
let MAX_REBOTES = 10;
let TAMANO_GRID = 30;
const VELOCIDAD_PING = 9;

let disparosRestantes = MAX_DISPAROS;
let rebotesRestantes = MAX_REBOTES;
let victoria = false;
let pausado = false;

let obstaculos = [];
let cuboInicialX = 100;
let cuboInicialY = 250;

const cubo = {
    x: 100,
    y: 250,
    tamano: 30,
    vx: 0,
    vy: 0,
    color: '#00adb5'
};

const objetivo = {
    x: 700,
    y: 250,
    radio: 25,
    color: '#ff5722'
};

// Carga del Nivel JSON
async function cargarNivel(url) {
    try {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("No se pudo obtener el nivel desde GitHub.");
        const data = await respuesta.json();
        aplicarDatosNivel(data);
    } catch (error) {
        console.warn("CORS/Red error, usando respaldo interno:", error);
        aplicarDatosNivel(NIVEL_DEFAULT);
    }
}

function aplicarDatosNivel(data) {
    if (!data) return;

    MAX_DISPAROS = data.maxShots ?? data.MaxDisparos ?? 5;
    MAX_REBOTES = data.maxBounces ?? data.MaxRebotes ?? 10;
    TAMANO_GRID = data.gridSize ?? data.GridSize ?? 30;

    const dataCubo = data.cubo || data.Cubo;
    if (dataCubo) {
        cuboInicialX = dataCubo.x ?? dataCubo.X ?? 100;
        cuboInicialY = dataCubo.y ?? dataCubo.Y ?? 250;
        cubo.color = data.cuboColor || dataCubo.color || dataCubo.Color || '#00adb5';
        cubo.tamano = TAMANO_GRID;
    }

    const dataMeta = data.meta || data.Meta;
    if (dataMeta) {
        objetivo.x = dataMeta.x ?? dataMeta.X ?? 700;
        objetivo.y = dataMeta.y ?? dataMeta.Y ?? 250;
        objetivo.radio = dataMeta.radio ?? dataMeta.Radio ?? (TAMANO_GRID / 2);
    }

    const listaObstaculos = data.obstaculos || data.Obstaculos || data.bloques || data.Bloques || [];
    obstaculos = listaObstaculos.map(obs => ({
        x: obs.x ?? obs.X ?? 0,
        y: obs.y ?? obs.Y ?? 0,
        w: obs.w ?? obs.width ?? obs.Ancho ?? TAMANO_GRID,
        h: obs.h ?? obs.height ?? obs.Alto ?? TAMANO_GRID,
        color: obs.color || obs.Color || '#FFFF00'
    }));

    reiniciarJuego();
}

function reiniciarJuego() {
    cubo.x = cuboInicialX;
    cubo.y = cuboInicialY;
    cubo.vx = 0;
    cubo.vy = 0;
    disparosRestantes = MAX_DISPAROS;
    rebotesRestantes = MAX_REBOTES;
    victoria = false;
    pausado = false;
    mensaje.style.color = '#4CAF50';
    mensaje.textContent = "Haz clic para lanzar el cubo (Presiona 'P' para pausar).";
}

btnReiniciar.addEventListener('click', reiniciarJuego);

window.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') {
        if (victoria) return;
        pausado = !pausado;
        if (pausado) {
            mensaje.style.color = '#ffeb3b';
            mensaje.textContent = "JUEGO PAUSADO. Presiona 'P' para continuar.";
        } else {
            mensaje.style.color = '#4CAF50';
            mensaje.textContent = "Haz clic para lanzar el cubo (Presiona 'P' para pausar).";
        }
    }
});

// Clics calibrados según la escala responsiva del canvas
canvas.addEventListener('click', (e) => {
    if (victoria || pausado) return;

    if (disparosRestantes > 0) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        const dx = mouseX - (cubo.x + cubo.tamano / 2);
        const dy = mouseY - (cubo.y + cubo.tamano / 2);

        const angulo = Math.atan2(dy, dx);
        cubo.vx = Math.cos(angulo) * VELOCIDAD_PING;
        cubo.vy = Math.sin(angulo) * VELOCIDAD_PING;

        disparosRestantes--;
    } else if (cubo.vx === 0 && cubo.vy === 0) {
        mensaje.style.color = '#f44336';
        mensaje.textContent = "¡Sin disparos restantes! Reinicia el nivel.";
    }
});

function procesarRebote() {
    rebotesRestantes--;
    if (rebotesRestantes <= 0) {
        reproducirSonidoBreak();
        reiniciarJuego();
        mensaje.style.color = '#f44336';
        mensaje.textContent = "¡Límite de rebotes alcanzado! Nivel reiniciado.";
    } else {
        reproducirSonidoRebote();
    }
}

function verificarColisionesObstaculos() {
    for (let obs of obstaculos) {
        if (cubo.x < obs.x + obs.w &&
            cubo.x + cubo.tamano > obs.x &&
            cubo.y < obs.y + obs.h &&
            cubo.y + cubo.tamano > obs.y) {
            
            const prevX = cubo.x - cubo.vx;
            const prevY = cubo.y - cubo.vy;

            if (prevX + cubo.tamano <= obs.x || prevX >= obs.x + obs.w) {
                cubo.vx *= -1;
            } else if (prevY + cubo.tamano <= obs.y || prevY >= obs.y + obs.h) {
                cubo.vy *= -1;
            } else {
                cubo.vx *= -1;
                cubo.vy *= -1;
            }

            procesarRebote();
            break;
        }
    }
}

function actualizar() {
    if (victoria || pausado) return;

    cubo.x += cubo.vx;
    cubo.y += cubo.vy;

    verificarColisionesObstaculos();

    if (cubo.x <= 0) {
        cubo.x = 0;
        cubo.vx *= -1;
        procesarRebote();
    } else if (cubo.x + cubo.tamano >= canvas.width) {
        cubo.x = canvas.width - cubo.tamano;
        cubo.vx *= -1;
        procesarRebote();
    }

    if (cubo.y <= 0) {
        cubo.y = 0;
        cubo.vy *= -1;
        procesarRebote();
    } else if (cubo.y + cubo.tamano >= canvas.height) {
        cubo.y = canvas.height - cubo.tamano;
        cubo.vy *= -1;
        procesarRebote();
    }

    const centroCuboX = cubo.x + cubo.tamano / 2;
    const centroCuboY = cubo.y + cubo.tamano / 2;
    const dist = Math.hypot(objetivo.x - centroCuboX, objetivo.y - centroCuboY);

    if (dist < objetivo.radio + cubo.tamano / 2) {
        victoria = true;
        cubo.vx = 0;
        cubo.vy = 0;
        mensaje.style.color = '#4CAF50';
        mensaje.textContent = "¡Ganaste World 1-1!";
    }
}

function dibujarUI() {
    ctx.font = '20px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    
    ctx.fillText(`Disparos: ${disparosRestantes}/${MAX_DISPAROS}`, 25, canvas.height - 25);
    ctx.fillText(`Rebotes restantes: ${rebotesRestantes}`, 25, 40);

    if (pausado) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = '40px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSA', canvas.width / 2, canvas.height / 2);
    }
}

function dibujar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let obs of obstaculos) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    }

    if (spriteCirculoCargado) {
        ctx.save();
        ctx.filter = 'sepia(100%) hue-rotate(-20deg) saturate(500%)';
        ctx.drawImage(
            spriteCirculo,
            objetivo.x - objetivo.radio,
            objetivo.y - objetivo.radio,
            objetivo.radio * 2,
            objetivo.radio * 2
        );
        ctx.restore();
    } else {
        ctx.beginPath();
        ctx.arc(objetivo.x, objetivo.y, objetivo.radio, 0, Math.PI * 2);
        ctx.fillStyle = objetivo.color;
        ctx.fill();
        ctx.closePath();
    }

    if (spriteCuboCargado) {
        ctx.drawImage(spriteCubo, cubo.x, cubo.y, cubo.tamano, cubo.tamano);
    } else {
        ctx.fillStyle = cubo.color;
        ctx.fillRect(cubo.x, cubo.y, cubo.tamano, cubo.tamano);
    }

    dibujarUI();
}

function gameLoop() {
    actualizar();
    dibujar();
    requestAnimationFrame(gameLoop);
}

// Inicializar
cargarNivel(URL_NIVEL_WORLD1);
gameLoop();
</script>

</body>
</html>
